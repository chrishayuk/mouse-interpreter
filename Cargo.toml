[package]
name = "mouse-interpreter"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

# The language server has its own crate so that the interpreter keeps no
# dependencies. `cargo build` here builds only the interpreter.
[workspace]
members = ["lsp"]
default-members = ["."]

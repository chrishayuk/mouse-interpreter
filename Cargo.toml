[package]
name = "mouse-interpreter"
version = "0.1.3"
license = "Apache-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# The program is called `mouse`.
[[bin]]
name = "mouse"
path = "src/main.rs"

[dependencies]

# The language server has its own crate so that the interpreter keeps no
# dependencies. `cargo build` here builds only the interpreter.
[workspace]
members = ["lsp"]
default-members = ["."]
